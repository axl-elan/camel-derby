<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Kamelrennen – ein Würfel-Rennspiel für bis zu 8 Kamele.">
  <title>Annikas Camel Derby</title>
  <!-- Real image files, so tablets and home-screen shortcuts (e.g. Amazon Kids trusted sites) can fetch an icon. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#5B1A8C">
  <meta property="og:title" content="Annikas Camel Derby">
  <meta property="og:image" content="https://axl-elan.github.io/camel-derby/icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lobster&family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/main.js"></script>
</head>
<body>

  <!-- ================= SETUP ================= -->
  <main id="setup" class="screen">
    <header class="brand">
      <span class="brand__icon" aria-hidden="true">🐫</span>
      <div>
        <h1 class="brand__title">Annikas Camel Derby</h1>
        <p class="brand__tagline">Bis zu 8 Kamele, 1 Würfel, viel Wüstenstaub</p>
      </div>
    </header>

    <div class="hero-banner" role="img" aria-label="Wüstenlandschaft"></div>

    <section class="card">
      <p class="setup-intro">Wähle, wer mitspielt. Menschen tragen ihren Namen ein, Computer-Kamele würfeln von allein.</p>
      <div id="playerList"></div>

      <div class="mode-picker">
        <div class="mode-picker__options" role="radiogroup" aria-label="Spielmodus">
          <button type="button" role="radio" data-mode="dice" aria-checked="true">🎲 Würfeln</button>
          <button type="button" role="radio" data-mode="quiz" aria-checked="false">🧮 Rechnen</button>
        </div>
        <p class="mode-picker__hint" id="modeHint" aria-live="polite"></p>
      </div>

      <div class="setup-actions">
        <span class="hint" id="setupHint" aria-live="polite"></span>
        <div class="row">
          <button type="button" class="btn btn--ghost" data-sound-toggle="label">🔊 Ton an</button>
          <button type="button" class="btn btn--primary" id="startBtn">🏁 Rennen starten</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ================= RACE ================= -->
  <main id="race" class="screen" hidden>
    <header class="race-top">
      <div class="brand">
        <span class="brand__icon" aria-hidden="true">🐫</span>
        <h1 class="brand__title brand__title--small">Annikas Camel Derby</h1>
      </div>
      <div class="row">
        <button type="button" class="icon-btn" data-sound-toggle="icon" title="Ton" aria-label="Ton an/aus">🔊</button>
        <button type="button" class="icon-btn" id="backBtn" title="Neue Spieler" aria-label="Neue Spieler">↩️</button>
      </div>
    </header>

    <div class="track" id="track"></div>

    <div class="rollbar card">
      <div class="dice" id="dice" aria-hidden="true">🎲</div>
      <div class="turn-info" aria-live="polite">
        <p class="turn-info__label" id="turnLabel">Bereit?</p>
        <p class="turn-info__sub" id="turnSub">Klicke auf würfeln, um zu starten.</p>
      </div>
      <button type="button" class="btn btn--roll" id="rollBtn">🎲 Würfeln</button>
    </div>
  </main>

  <!-- ================= QUIZ ================= -->
  <div id="quizOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="quizProblem" hidden>
    <div class="quiz-card">
      <p class="quiz-card__player" id="quizPlayer"></p>
      <div class="quiz-timer" role="timer" aria-live="off">
        <div class="quiz-timer__bar" id="quizBar"></div>
      </div>
      <p class="quiz-timer__label" id="quizPoints"></p>
      <p class="quiz-card__problem" id="quizProblem"></p>
      <div class="quiz-options" id="quizOptions">
        <button type="button" class="quiz-option" data-index="0"></button>
        <button type="button" class="quiz-option" data-index="1"></button>
        <button type="button" class="quiz-option" data-index="2"></button>
      </div>
      <p class="quiz-card__feedback" id="quizFeedback" aria-live="assertive"></p>
    </div>
  </div>

  <!-- ================= RESULT ================= -->
  <div id="resultOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
    <div class="result-card">
      <div class="result-card__hero" role="img" aria-label="Kamelreiter"></div>
      <h2 class="result-card__title" id="resultTitle">🏆 Zieleinlauf!</h2>
      <p class="result-card__sub">Alle Kamele sind im Ziel.</p>
      <ol class="ranking" id="rankList"></ol>
      <div class="result-actions">
        <button type="button" class="btn btn--primary" id="playAgainBtn">🔁 Nochmal spielen</button>
        <button type="button" class="btn btn--ghost" id="newPlayersBtn">👥 Neue Spieler</button>
      </div>
    </div>
  </div>

  <!-- ================= TEMPLATES ================= -->
  <template id="playerRowTemplate">
    <div class="player-row">
      <button type="button" class="active-toggle" data-action="toggle" aria-label="Mitspielen"></button>
      <input type="text" class="player-row__name" data-action="name" maxlength="24" autocomplete="off">
      <button type="button" class="type-toggle" data-action="type"></button>
      <div class="player-row__color" aria-hidden="true"></div>
    </div>
  </template>

  <template id="laneTemplate">
    <div class="lane">
      <div class="lane__label">
        <span class="lane__swatch"></span>
        <span class="lane__name"></span>
      </div>
      <div class="lane__track"></div>
      <div class="lane__runway">
        <div class="camel"><img alt=""></div>
      </div>
    </div>
  </template>

  <template id="rankRowTemplate">
    <li class="ranking__row">
      <span class="ranking__medal"></span>
      <span class="ranking__name"></span>
    </li>
  </template>

</body>
</html>
