@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sand:#2B2118; --sand-2:#332619; --dune:#3E2E1C;
    --ink:#F3E4CE; --ink-soft:#D8C1A0;
    --card:#3A2B1C; --line: rgba(243,228,206,.14);
  }
}
:root[data-theme="dark"]{
  --sand:#2B2118; --sand-2:#332619; --dune:#3E2E1C;
  --ink:#F3E4CE; --ink-soft:#D8C1A0;
  --card:#3A2B1C; --line: rgba(243,228,206,.14);
}
*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
body{
  margin:0; min-height:100%;
  background: radial-gradient(1200px 700px at 50% -10%, var(--sand-2), var(--sand));
  color:var(--ink);
  font-family:'Nunito', system-ui, -apple-system, sans-serif;
  overflow-x:hidden;
}
h1,h2,.brand,.roll-label{font-family:'Baloo 2', system-ui, sans-serif;}
button{font-family:inherit; cursor:pointer;}
.screen{max-width:980px; margin:0 auto; padding:28px 20px 40px;}
.hidden{display:none !important;}

/* ---------- Header ---------- */
.brand{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.brand .icon{font-size:40px;}
.brand h1{font-size:clamp(28px,5vw,40px); margin:0; color:var(--sun-deep); font-weight:800;}
.brand p{margin:2px 0 0; color:var(--ink-soft); font-weight:700; font-size:15px;}

/* ---------- Setup ---------- */
.hero-banner{
  width:100%; aspect-ratio:1983/793; max-height:220px; border-radius:22px; margin-bottom:18px;
  background-image:var(--bg-desert); background-size:cover; background-position:center 42%;
  box-shadow:0 6px 0 var(--dune);
}
.result-hero{
  width:100%; aspect-ratio:1983/793; max-height:140px; border-radius:18px; margin-bottom:16px;
  background-image:var(--bg-riders); background-size:cover; background-position:center 55%;
}
.setup-card{background:var(--card); border-radius:22px; padding:22px; box-shadow:0 6px 0 var(--dune);}
.setup-intro{margin:0 0 16px; color:var(--ink-soft); font-weight:700; line-height:1.5;}
.player-row{
  display:grid; grid-template-columns:44px 1fr auto auto; gap:10px; align-items:center;
  padding:10px 8px; border-bottom:1px solid var(--line);
}
.player-row:last-of-type{border-bottom:none;}
.dot{width:26px; height:26px; border-radius:50%; border:3px solid var(--ink); justify-self:center;}
.player-row input[type=text]{
  width:100%; padding:11px 12px; border-radius:12px; border:2px solid var(--line);
  background:transparent; color:var(--ink); font-weight:700; font-size:16px;
}
.player-row input[type=text]:disabled{opacity:.55;}
.seg{display:flex; border:2px solid var(--line); border-radius:12px; overflow:hidden;}
.seg button{
  border:none; background:transparent; padding:9px 12px; font-weight:800; font-size:13px; color:var(--ink-soft);
}
.seg button.active{background:var(--sun); color:#fff;}
.active-toggle{
  width:44px; height:44px; border-radius:12px; border:2px solid var(--line); background:transparent;
  font-size:20px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
}
.active-toggle.on{background:var(--palm); border-color:var(--palm); color:#fff;}

.setup-actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; align-items:center; justify-content:space-between;}
.hint{color:var(--ink-soft); font-weight:700; font-size:14px;}
.btn-primary{
  background:var(--sun); color:#fff; border:none; border-radius:16px; padding:16px 28px;
  font-weight:800; font-size:18px; box-shadow:0 5px 0 var(--sun-deep);
}
.btn-primary:active{transform:translateY(3px); box-shadow:0 2px 0 var(--sun-deep);}
.btn-primary:disabled{opacity:.5;}
.btn-ghost{
  background:transparent; border:2px solid var(--line); color:var(--ink); border-radius:14px;
  padding:10px 16px; font-weight:800;
}

/* ---------- Race ---------- */
.race-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
.race-top .brand{margin-bottom:0;}
.icon-btn{
  background:var(--card); border:2px solid var(--line); border-radius:12px; width:44px; height:44px;
  font-size:18px; display:flex; align-items:center; justify-content:center; color:var(--ink);
}
.track-wrap{
  background-color:#DC8D0B;
  background-image: var(--bg-desert);
  background-size: 100% auto;
  background-repeat: no-repeat;
  background-position: top center;
  border-radius:22px; padding:170px 16px 12px; box-shadow:0 6px 0 var(--dune);
}
.lane{position:relative; height:56px; margin-bottom:6px;}
.lane-label{
  position:absolute; left:0; top:0; width:118px; height:100%; display:flex; align-items:center; gap:6px;
  font-weight:800; font-size:13px; z-index:2; background:linear-gradient(90deg, var(--card) 70%, transparent);
  padding-right:8px;
}
.lane-label .swatch{width:10px; height:10px; border-radius:50%; flex:none;}
.lane-label span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lane-track{
  margin-left:118px; height:100%; border-radius:12px; position:relative; overflow:hidden;
  background-image:
    repeating-linear-gradient(90deg, transparent, transparent calc(100%/25 - 1px), rgba(255,255,255,.55) calc(100%/25 - 1px), rgba(255,255,255,.55) calc(100%/25)),
    var(--bg-sand);
  background-size: 100% 100%, cover;
  background-position: 0 0, center;
}
.lane-track::after{content:"🏁"; position:absolute; right:-6px; top:50%; transform:translateY(-50%); font-size:20px;}
.camel{
  position:absolute; top:50%; transform:translate(-50%,-50%);
  transition:left .55s cubic-bezier(.34,1.4,.5,1);
}
.camel img{
  display:block; height:46px; width:auto;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.28));
}
.finish-badge{
  position:absolute; top:-8px; right:2px; font-size:11px; font-weight:800; background:var(--palm);
  color:#fff; padding:1px 6px; border-radius:8px;
}

/* ---------- Roll bar ---------- */
.rollbar{
  position:sticky; bottom:0; margin-top:18px; background:var(--card); border-radius:22px; padding:16px 18px;
  box-shadow:0 6px 0 var(--dune); display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.dice{
  width:64px; height:64px; border-radius:16px; background:var(--sand-2); border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:36px; flex:none;
}
.turn-info{flex:1; min-width:160px;}
.roll-label{font-size:18px; font-weight:800; margin:0;}
.turn-sub{margin:2px 0 0; color:var(--ink-soft); font-weight:700; font-size:13px;}
.btn-roll{
  background:var(--sky); color:#fff; border:none; border-radius:16px; padding:16px 30px;
  font-weight:800; font-size:18px; box-shadow:0 5px 0 var(--sky-deep); flex:none;
}
.btn-roll:active{transform:translateY(3px); box-shadow:0 2px 0 var(--sky-deep);}
.btn-roll:disabled{opacity:.5;}

/* ---------- Result overlay ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center;
  padding:20px; z-index:10;
}
.result-card{
  background:var(--card); border-radius:24px; padding:28px 26px; max-width:440px; width:100%;
  box-shadow:0 10px 0 var(--dune); max-height:85vh; overflow-y:auto;
}
.result-card h2{margin:0 0 4px; font-size:26px; color:var(--sun-deep);}
.result-card p.sub{margin:0 0 18px; color:var(--ink-soft); font-weight:700;}
.rank-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
.rank-row:last-child{border-bottom:none;}
.rank-num{font-weight:800; width:28px; font-size:16px; color:var(--ink-soft);}
.rank-row.top1 .rank-num{color:#C79A2A;}
.rank-row.top2 .rank-num{color:#8C8C94;}
.rank-row.top3 .rank-num{color:#A05A2C;}
.rank-name{flex:1; font-weight:800;}
.result-actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;}

@media (max-width:640px){
  .track-wrap{padding-top:110px;}
  .lane-label{width:88px; font-size:11px;}
  .lane-track{margin-left:88px;}
  .camel img{height:34px;}
}
</style>
</head>
<body>

<!-- ================= SETUP ================= -->
<div id="setup" class="screen">
  <div class="brand"><span class="icon">🐫</span><div><h1>Kamelrennen</h1><p>Bis zu 8 Kamele, 1 Würfel, viel Wüstenstaub</p></div></div>

  <div class="hero-banner"></div>

  <div class="setup-card">
    <p class="setup-intro">Wähle, wer mitspielt. Menschen tragen ihren Namen ein, Computer-Kamele würfeln von allein.</p>
    <div id="playerList"></div>
    <div class="setup-actions">
      <span class="hint" id="setupHint">Mindestens 2 aktive Kamele nötig.</span>
      <div style="display:flex; gap:10px;">
        <button class="btn-ghost" id="soundToggleSetup">🔊 Ton an</button>
        <button class="btn-primary" id="startBtn">🏁 Rennen starten</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= RACE ================= -->
<div id="race" class="screen hidden">
  <div class="race-top">
    <div class="brand"><span class="icon">🐫</span><h1 style="font-size:26px;">Kamelrennen</h1></div>
    <div style="display:flex; gap:10px;">
      <button class="icon-btn" id="soundToggleRace" title="Ton">🔊</button>
      <button class="icon-btn" id="backBtn" title="Neue Spieler">↩️</button>
    </div>
  </div>

  <div class="track-wrap" id="trackWrap"></div>

  <div class="rollbar">
    <div class="dice" id="dice">🎲</div>

eAh5ACKUPvm5aikmoe/0hA8YHwkPGQUV6YU1+L3kKze/sPhtr2m9Xmfz95jITt/2g2T4SD+Id92A+FBwvAH5ujDJLUTUeoeLvjwdWNy9Ioq0Djx5xY9WFfcKvJkrzufjTj7k/iMD/mCpY7bxJRqA99heL9x5w+G2U27/vuT+zEbxHaqRsg1BjkS3PMo1E7/iloq8se9eEvj6jY462Tk+bJycnWT8G3usV4dF/ZU/T/Zzi6/x9sF7LzpSDCPAAAAABJRU5ErkJggg=="];

  let sound = true;
  let players = [];      // {id,name,type,color,position,finished,rank}
  let order = [];        // indices into players, current turn rotation
  let turnPos = 0;
  let finishCount = 0;
  let busy = false;

  // ---------- Audio ----------
  let actx;
  function ctx(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function tone(freq, start, dur, type, vol){
    if(!sound) return;
    const c = ctx(); if(!c) return;
    try{
      const o = c.createOscillator(), g = c.createGain();
      o.type = type||"triangle"; o.frequency.value = freq;
      g.gain.value = 0;
      o.connect(g); g.connect(c.destination);
      const t0 = c.currentTime + start;
      g.gain.linearRampToValueAtTime(vol||0.15, t0+0.02);
      g.gain.linearRampToValueAtTime(0, t0+dur);
      o.start(t0); o.stop(t0+dur+0.02);
    }catch(e){}
  }
  function sfxRoll(){ for(let i=0;i<5;i++) tone(300+Math.random()*300, i*0.09, 0.08, "square", 0.08); }
  function sfxStep(){ tone(520,0,0.09,"triangle",0.12); }
  function sfxFinish(rank){
    const notes = rank===1 ? [523,659,784,1047] : rank===2 ? [493,587,698] : [440,523];
    notes.forEach((f,i)=> tone(f, i*0.13, 0.18, "triangle", 0.14));
  }

  // ---------- Setup screen ----------
  const playerList = document.getElementById("playerList");
  function defaultRow(i){
    const isHuman = i < 2;
    return { active: i < 2, type: isHuman ? "human" : "computer", name: "" };
  }
  let rows = Array.from({length:8}, (_,i)=> defaultRow(i));

  function renderSetup(){
    playerList.innerHTML = "";
    rows.forEach((row, i) => {
      const div = document.createElement("div");
      div.className = "player-row";
      div.innerHTML = `
        <button class="active-toggle ${row.active?'on':''}" data-i="${i}" data-act="toggle">${row.active?'✓':'—'}</button>
        <input type="text" data-i="${i}" data-act="name" placeholder="${row.type==='human' ? 'Spieler '+(i+1) : COMPUTER_NAMES[i]}" value="${row.name}" ${row.type==='computer' || !row.active ? 'disabled':''}>
        <div class="seg" data-i="${i}">
          <button data-act="human" class="${row.type==='human'?'active':''}">Mensch</button>
          <button data-act="computer" class="${row.type==='computer'?'active':''}">Computer</button>
        </div>
        <div class="dot" style="background:${COLORS[i]}"></div>
      `;
      playerList.appendChild(div);
    });
    const activeCount = rows.filter(r=>r.active).length;
    document.getElementById("startBtn").disabled = activeCount < 2;
    document.getElementById("setupHint").textContent = activeCount < 2
      ? "Mindestens 2 aktive Kamele nötig."
      : activeCount + " Kamele bereit zum Start.";
  }
  playerList.addEventListener("click", (e)=>{
    const btn = e.target.closest("button"); if(!btn) return;
    const i = parseInt(btn.dataset.i ?? btn.parentElement.dataset.i, 10);
    if(btn.dataset.act === "toggle"){ rows[i].active = !rows[i].active; }
    else if(btn.dataset.act === "human"){ rows[i].type = "human"; }
    else if(btn.dataset.act === "computer"){ rows[i].type = "computer"; }
    renderSetup();
  });
  playerList.addEventListener("input", (e)=>{
    if(e.target.dataset.act === "name"){
      rows[parseInt(e.target.dataset.i,10)].name = e.target.value;
    }
  });
  renderSetup();

  document.getElementById("soundToggleSetup").addEventListener("click", toggleSound);
  document.getElementById("soundToggleRace").addEventListener("click", toggleSound);
  function toggleSound(){
    sound = !sound;
    const label = sound ? "🔊 Ton an" : "🔈 Ton aus";
    document.getElementById("soundToggleSetup").textContent = label;
    document.getElementById("soundToggleRace").textContent = sound ? "🔊" : "🔈";
  }

  document.getElementById("startBtn").addEventListener("click", ()=>{
    players = [];
    rows.forEach((r,i)=>{
      if(!r.active) return;
      players.push({
        id: players.length,
        name: r.name.trim() || (r.type==='human' ? 'Spieler '+(i+1) : COMPUTER_NAMES[i % COMPUTER_NAMES.length]),
        type: r.type,
        color: COLORS[i],
        img: CAMEL_IMAGES[i],
        position: 0,
        finished: false,
        rank: 0
      });
    });
    startRace();
  });

  // ---------- Race screen ----------
  const trackWrap = document.getElementById("trackWrap");
  const rollBtn = document.getElementById("rollBtn");
  const dice = document.getElementById("dice");
  const turnLabel = document.getElementById("turnLabel");
  const turnSub = document.getElementById("turnSub");
  const DICE_FACES = ["","⚀","⚁","⚂","⚃","⚄","⚅"];

  function startRace(){
    document.getElementById("setup").classList.add("hidden");
    document.getElementById("race").classList.remove("hidden");
    document.getElementById("resultOverlay").classList.add("hidden");
    order = players.map(p=>p.id);
    turnPos = 0; finishCount = 0; busy = false;
    players.forEach(p=>{ p.position=0; p.finished=false; p.rank=0; });
    renderTrack();
    updateTurnUI();
  }

  function renderTrack(){
    trackWrap.innerHTML = "";
    players.forEach(p=>{
      const lane = document.createElement("div");
      lane.className = "lane";
      lane.innerHTML = `
        <div class="lane-label"><span class="swatch" style="background:${p.color}"></span><span>${escapeHtml(p.name)}</span></div>
        <div class="lane-track">
          <div class="camel" id="camel-${p.id}" style="left:${posPct(p.position)}%">
            <img src="${p.img}" alt="${escapeHtml(p.name)}">
          </div>
        </div>`;
      trackWrap.appendChild(lane);
    });
  }
  function posPct(pos){
    const clamped = Math.min(pos, TRACK_LENGTH);
    return 2 + (clamped / TRACK_LENGTH) * 94;
  }
  function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

  function currentPlayer(){
    for(let i=0;i<order.length;i++){
      const idx = order[(turnPos+i) % order.length];
      const p = players.find(pl=>pl.id===idx);
      if(!p.finished) return p;
    }
    return null;
  }

  function updateTurnUI(){
    const p = currentPlayer();
    if(!p){ return; }
    turnLabel.textContent = (p.type==='human' ? p.name+" ist dran" : p.name+" (Computer) würfelt...");
    turnSub.textContent = p.type==='human' ? "Klicke auf würfeln." : "Einen Moment...";
    rollBtn.disabled = p.type !== 'human' || busy;
    if(p.type === 'computer' && !busy){
      busy = true;
      setTimeout(()=> doRoll(p), 700 + Math.random()*500);
    }
  }

  rollBtn.addEventListener("click", ()=>{
    const p = currentPlayer();
    if(!p || p.type!=='human' || busy) return;
    busy = true;
    doRoll(p);
  });

  function doRoll(p){
    rollBtn.disabled = true;
    sfxRoll();
    let ticks = 0;
    const spin = setInterval(()=>{
      dice.textContent = DICE_FACES[1+Math.floor(Math.random()*6)];
      ticks++;
      if(ticks > 9){
        clearInterval(spin);
        const value = 1 + Math.floor(Math.random()*6);
        dice.textContent = DICE_FACES[value];
        movePlayer(p, value);
      }
    }, 70);
  }

  function movePlayer(p, value){
    p.position = Math.min(p.position + value, TRACK_LENGTH);
    const el = document.getElementById("camel-"+p.id);
    el.style.left = posPct(p.position) + "%";
    sfxStep();
    turnSub.textContent = p.name + " würfelt " + value + " und läuft " + value + " Felder.";

    setTimeout(()=>{
      if(p.position >= TRACK_LENGTH && !p.finished){
        p.finished = true;
        finishCount++;
        p.rank = finishCount;
        const lane = el.closest(".lane-track");
        const badge = document.createElement("div");
        badge.className = "finish-badge";
        badge.textContent = "#"+p.rank;
        lane.appendChild(badge);
        sfxFinish(p.rank);
      }
      turnPos = (turnPos + 1) % order.length;
      busy = false;
      if(finishCount === players.length){
        showResults();
      } else {
        updateTurnUI();
      }
    }, 600);
  }

  function showResults(){
    const ranked = players.slice().sort((a,b)=>a.rank-b.rank);
    const list = document.getElementById("rankList");
    list.innerHTML = ranked.map((p,i)=>{
      const medal = i===0?"🥇":i===1?"🥈":i===2?"🥉":"🐫";
      return `<div class="rank-row top${i+1}"><span class="rank-num">${medal}</span><span class="rank-name">${escapeHtml(p.name)}</span></div>`;
    }).join("");
    document.getElementById("resultOverlay").classList.remove("hidden");
  }

  document.getElementById("playAgainBtn").addEventListener("click", ()=>{
    document.getElementById("resultOverlay").classList.add("hidden");
    startRace();
  });
  document.getElementById("newPlayersBtn").addEventListener("click", ()=>{
    document.getElementById("resultOverlay").classList.add("hidden");
    document.getElementById("race").classList.add("hidden");
    document.getElementById("setup").classList.remove("hidden");
  });
  document.getElementById("backBtn").addEventListener("click", ()=>{
    document.getElementById("race").classList.add("hidden");
    document.getElementById("setup").classList.remove("hidden");
  });
})();
</script>
</body>
</html>
